name: Orchestration — deploy to Azure Container Apps

# Called from orchestration-build-and-push.yml (secrets: inherit) or run manually.
# Note: workflow_run cannot access repository secrets — do not use that trigger here.

on:
  workflow_call:
    secrets:
      AZURE_CREDENTIALS:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
  workflow_dispatch:

env:
  AZURE_RG: ${{ vars.ORCH_AZURE_RG }}
  APP_NAME: ${{ vars.ORCH_APP_NAME }}
  MCP_APP_NAME: ${{ vars.ORCH_MCP_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check GitHub Actions configuration
        run: |
          set -e
          if [ -z "${ORCH_AZURE_RG}" ] || [ -z "${ORCH_APP_NAME}" ]; then
            echo "::error::Set repository variables ORCH_AZURE_RG and ORCH_APP_NAME (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
        env:
          ORCH_AZURE_RG: ${{ vars.ORCH_AZURE_RG }}
          ORCH_APP_NAME: ${{ vars.ORCH_APP_NAME }}

      - name: Azure login (service principal JSON)
        id: azure_login_creds
        continue-on-error: true
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login (OIDC)
        id: azure_login_oidc
        if: steps.azure_login_creds.outcome == 'failure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login failed — add AZURE_CREDENTIALS secret
        if: steps.azure_login_creds.outcome == 'failure' && steps.azure_login_oidc.outcome == 'failure'
        run: |
          echo "::error::Azure login failed. Add repository secret AZURE_CREDENTIALS:"
          echo "  1. Run locally: az ad sp create-for-rbac --name github-agentic-deploy --role contributor --scopes /subscriptions/<SUB>/resourceGroups/rg-react-pr --sdk-auth"
          echo "  2. Copy the entire JSON output"
          echo "  3. GitHub → Settings → Secrets and variables → Actions → New secret → name: AZURE_CREDENTIALS"
          echo "  (Or set AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID for OIDC)"
          exit 1

      - name: Verify Azure CLI session
        run: az account show --query name -o tsv

      - name: Resolve container image (GHCR owner must be lowercase)
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${OWNER}/pr-orchestrator:latest" >> $GITHUB_ENV

      - name: Update orchestrator container app
        env:
          MCP_APP_NAME: ${{ vars.ORCH_MCP_APP_NAME }}
        run: |
          MCP_NAME="${MCP_APP_NAME:-github-mcp}"
          az containerapp update \
            -g "$AZURE_RG" -n "$APP_NAME" \
            --image "$IMAGE" \
            --set-env-vars "MCP_SERVER_URL=http://${MCP_NAME}" "ORCH_CHECKPOINT_DB=/data/.orchestration_state.db"

      - name: Show app URL
        run: |
          FQDN=$(az containerapp show -g "$AZURE_RG" -n "$APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Orchestrator: https://$FQDN"
          echo "Health:       https://$FQDN/api/health"
          echo "Run:          curl -X POST https://$FQDN/api/orchestrate -H 'Content-Type: application/json' -d '{\"repo\":\"owner/repo\",\"pr\":42}'"
