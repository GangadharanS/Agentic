name: ReAct — deploy to Azure Container Apps

# Triggers after the ReAct build workflow succeeds, or manually.

on:
  workflow_run:
    workflows: ["ReAct — build & push images to GHCR"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RG: ${{ vars.REACT_AZURE_RG }}
  API_NAME: ${{ vars.REACT_API_NAME }}
  UI_NAME: ${{ vars.REACT_UI_NAME }}
  MCP_APP_NAME: ${{ vars.REACT_MCP_APP_NAME }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/react-pr-api:latest
  UI_IMAGE: ghcr.io/${{ github.repository_owner }}/react-pr-ui:latest

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check GitHub Actions configuration
        run: |
          set -e
          missing=0
          if [ -z "${REACT_AZURE_RG}" ] || [ -z "${REACT_API_NAME}" ] || [ -z "${REACT_UI_NAME}" ]; then
            echo "::error::Set repository variables REACT_AZURE_RG, REACT_API_NAME, REACT_UI_NAME (Settings → Secrets and variables → Actions → Variables)."
            missing=1
          fi
          if [ "${USE_OIDC}" != "true" ] && [ "${USE_CREDS}" != "true" ]; then
            echo "::error::No Azure login secret found on this repository."
            echo "Add ONE of these under Settings → Secrets and variables → Actions → Repository secrets:"
            echo "  • AZURE_CREDENTIALS — paste full JSON from: az ad sp create-for-rbac ... --sdk-auth  (easiest)"
            echo "  • OR AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID — OIDC; also add federated credential in Entra ID"
            echo "Use the same GitHub repo that runs this workflow (not a fork). Names are case-sensitive."
            missing=1
          fi
          exit "$missing"
        env:
          REACT_AZURE_RG: ${{ vars.REACT_AZURE_RG }}
          REACT_API_NAME: ${{ vars.REACT_API_NAME }}
          REACT_UI_NAME: ${{ vars.REACT_UI_NAME }}
          USE_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
          USE_CREDS: ${{ secrets.AZURE_CREDENTIALS != '' }}

      # Prefer OIDC when all three IDs are set; otherwise one JSON secret (no federated credential).
      - name: Azure login (OIDC)
        if: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal JSON)
        if: ${{ secrets.AZURE_CREDENTIALS != '' && !(secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '') }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update backend container app
        run: |
          MCP_NAME="${MCP_APP_NAME:-github-mcp}"
          az containerapp update \
            -g "$AZURE_RG" -n "$API_NAME" \
            --image "$BACKEND_IMAGE" \
            --set-env-vars "MCP_SERVER_URL=http://${MCP_NAME}"

      - name: Update UI container app
        run: |
          # BACKEND_URL wires nginx /api/* -> internal API app (see ReAct/ui/nginx.conf.template).
          az containerapp update \
            -g "$AZURE_RG" -n "$UI_NAME" \
            --image "$UI_IMAGE" \
            --set-env-vars "BACKEND_URL=http://${API_NAME}"

      - name: Show app URLs
        run: |
          API_URL=$(az containerapp show -g "$AZURE_RG" -n "$API_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          UI_URL=$(az containerapp show -g "$AZURE_RG" -n "$UI_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Backend: https://$API_URL"
          echo "UI:      https://$UI_URL"
