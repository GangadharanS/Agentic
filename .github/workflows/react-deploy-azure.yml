name: ReAct — deploy to Azure Container Apps

# Called from react-build-and-push.yml (secrets: inherit) or run manually.
# Note: workflow_run cannot access repository secrets — do not use that trigger here.

on:
  workflow_call:
    secrets:
      AZURE_CREDENTIALS:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
  workflow_dispatch:

env:
  AZURE_RG: ${{ vars.REACT_AZURE_RG }}
  API_NAME: ${{ vars.REACT_API_NAME }}
  UI_NAME: ${{ vars.REACT_UI_NAME }}
  MCP_APP_NAME: ${{ vars.REACT_MCP_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check GitHub Actions configuration
        run: |
          set -e
          if [ -z "${REACT_AZURE_RG}" ] || [ -z "${REACT_API_NAME}" ] || [ -z "${REACT_UI_NAME}" ]; then
            echo "::error::Set repository variables REACT_AZURE_RG, REACT_API_NAME, REACT_UI_NAME (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
        env:
          REACT_AZURE_RG: ${{ vars.REACT_AZURE_RG }}
          REACT_API_NAME: ${{ vars.REACT_API_NAME }}
          REACT_UI_NAME: ${{ vars.REACT_UI_NAME }}

      - name: Azure login (service principal JSON)
        id: azure_login_creds
        continue-on-error: true
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login (OIDC)
        id: azure_login_oidc
        if: steps.azure_login_creds.outcome == 'failure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login failed — add AZURE_CREDENTIALS secret
        if: steps.azure_login_creds.outcome == 'failure' && steps.azure_login_oidc.outcome == 'failure'
        run: |
          echo "::error::Azure login failed. Add repository secret AZURE_CREDENTIALS (full JSON from az ad sp create-for-rbac --sdk-auth)."
          exit 1

      - name: Verify Azure CLI session
        run: az account show --query name -o tsv

      - name: Update backend container app
        env:
          GHCR_OWNER_VAR: ${{ vars.GHCR_OWNER }}
        run: |
          if [ -n "${GHCR_OWNER_VAR}" ]; then
            OWNER="${GHCR_OWNER_VAR}"
          else
            OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          fi
          BACKEND_IMAGE="ghcr.io/${OWNER}/react-pr-api:latest"
          MCP_NAME="${MCP_APP_NAME:-github-mcp}"
          echo "Deploying backend image: ${BACKEND_IMAGE}"
          az containerapp update \
            -g "$AZURE_RG" -n "$API_NAME" \
            --image "${BACKEND_IMAGE}" \
            --set-env-vars "MCP_SERVER_URL=http://${MCP_NAME}"

      - name: Update UI container app
        env:
          GHCR_OWNER_VAR: ${{ vars.GHCR_OWNER }}
        run: |
          if [ -n "${GHCR_OWNER_VAR}" ]; then
            OWNER="${GHCR_OWNER_VAR}"
          else
            OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          fi
          UI_IMAGE="ghcr.io/${OWNER}/react-pr-ui:latest"
          echo "Deploying UI image: ${UI_IMAGE}"
          az containerapp update \
            -g "$AZURE_RG" -n "$UI_NAME" \
            --image "${UI_IMAGE}" \
            --set-env-vars "BACKEND_URL=http://${API_NAME}"

      - name: Show app URLs
        run: |
          API_URL=$(az containerapp show -g "$AZURE_RG" -n "$API_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          UI_URL=$(az containerapp show -g "$AZURE_RG" -n "$UI_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Backend: https://$API_URL"
          echo "UI:      https://$UI_URL"
