# Local-only reference (Vite dev server proxies /api; see vite.config.js).
# Container images use nginx.conf.template + react-entrypoint.sh + BACKEND_URL.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
